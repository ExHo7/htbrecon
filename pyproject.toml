[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "htbrecon"
version = "0.1.0"
description = "Automated reconnaissance tool for Hack The Box"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.12.5",
    "jinja2>=3.1.6",
    "anthropic>=0.40",
]

[project.scripts]
htbrecon = "htbrecon.cli:app"
