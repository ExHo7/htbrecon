name: Pipeline

on: 
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    name: Lint with Ruff
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install Ruff
      run: pip install ruff
    - name: Run Ruff
      run: ruff check htbrecon/

  audit:
    runs-on: ubuntu-latest
    name: Dependency audit with pip-audit
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install project + pip-audit
        run: pip install -e . pip-audit
      - name: Run pip-audit
        run: pip-audit --skip-editable || true

  mypy:
    runs-on: ubuntu-latest
    name: Type check with mypy
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install Dependencies
      run: |
        pip install -e . mypy
    - name: Run mypy
      run: |
        mypy htbrecon/ --ignore-missing-imports --exclude htbrecon/__main__

  tests:
    runs-on: ubuntu-latest
    name: Unit tests with pytest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install Dependencies
      run: pip install -e . pytest
    - name: Run pytest
      run: pytest -q