name: Lint

on: [push]

jobs:
  ruff:
    runs-on: ubuntu-latest
    name: Lint with Ruff
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: 3.10
    - name: Install Ruff
      run: pip install ruff
    - name: Run Ruff
      run: ruff check htbrecon/

  mypy:
    runs-on: ubuntu-latest
    name: Type check with mypy
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: 3.10
    - name: Install Dependencies
      run: |
        pip install -e .[dev]
    - name: Run mypy
      run: |
        MYPYPATH=htbrecon mypy --disallow-untyped-defs --namespace-packages --explicit-package-bases htbrecon/