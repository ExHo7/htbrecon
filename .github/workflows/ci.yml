name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install ruff mypy
      - run: ruff check htbrecon/
      - run: ruff format --check htbrecon/
      - run: mypy htbrecon/ --ignore-missing-imports
        continue-on-error: true

  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -e . build twine
      - run: python -m build
      - run: twine check dist/*
